services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ats
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ats-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ats"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ats
      DATABASE_USER: ats
      DATABASE_PASSWORD: ats_local_only
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      APP_PUBLIC_URL: http://localhost:5174
      MAIL_FROM: ats@example.test
      DOCUMENT_DIR: /data/documents
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ats-private-documents:/data/documents
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      - api

volumes:
  ats-postgres-data:
  ats-private-documents:
