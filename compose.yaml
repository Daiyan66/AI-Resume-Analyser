services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ats
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ats-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ats"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ats
      DATABASE_USER: ats
      DATABASE_PASSWORD: ats_local_only
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      - api

volumes:
  ats-postgres-data:
