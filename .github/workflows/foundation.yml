name: New platform foundation

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ats_test
          POSTGRES_USER: ats_test
          POSTGRES_PASSWORD: ats_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ats_test -d ats_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/ats_test
      DATABASE_USER: ats_test
      DATABASE_PASSWORD: ats_test_only
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Run API tests and package
        run: mvn --batch-mode --no-transfer-progress verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t ats-api:ci apps/api
      - run: docker build -t ats-web:ci apps/web
