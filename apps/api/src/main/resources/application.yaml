spring:
  application:
    name: ats-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

app:
  public-url: ${APP_PUBLIC_URL}
  mail-from: ${MAIL_FROM}
  document-dir: ${DOCUMENT_DIR}
  notifications:
    email-enabled: ${APPLICATION_EMAIL_ENABLED:false}
  ai:
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    endpoint: ${AI_ENDPOINT:https://openrouter.ai/api/v1/chat/completions}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
