spring.application.name=ResumeSystemApplication

# Server
server.port=8080

# Database Configuration (MySQL 8 - ai_resume)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_resume?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# JWT Security
jwt.secret=${JWT_SECRET:MyVeryStrongSecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Cloud AI Configuration (Google Gemini 1.5/2.0 Flash)
ai.gemini.api-key=${GEMINI_API_KEY:your-key-here}
ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
ai.gemini.url=https://generativelanguage.googleapis.com/v1beta/models

# Email Configuration (Spring Mail)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
mail.sender.name=ATS Recruitment Platform

# Upload Storage Directory
file.upload-dir=${UPLOAD_DIR:uploads/resumes}
